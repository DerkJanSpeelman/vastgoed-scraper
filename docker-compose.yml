services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vastgoed
      POSTGRES_USER: vastgoed
      POSTGRES_PASSWORD: vastgoed
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastgoed -d vastgoed"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgres://vastgoed:vastgoed@db:5432/vastgoed
      NODE_ENV: development
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "yarn install && yarn dev"

volumes:
  db_data:
