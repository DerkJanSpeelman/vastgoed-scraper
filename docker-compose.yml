services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vastgoed
      POSTGRES_USER: vastgoed
      POSTGRES_PASSWORD: vastgoed
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastgoed -d vastgoed"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgres://vastgoed:vastgoed@db:5432/vastgoed
      SCRAPER_URL: http://scraper:3001
      NODE_ENV: development
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_healthy
    command: sh -c "yarn install && yarn dev"

volumes:
  db_data:
